# Stage 6: Windows installer build (PyInstaller onedir + Inno Setup) on a GitHub windows runner.
#
# * pull request into develop or main / manual run (workflow_dispatch, optional «version» for a test build of
#   another version, e.g. 1.0.1 for the update test repository) → artifact «SignatureExtractor-<ver>-setup»
#   with the installer and its .sha256.  Nothing is published.
# * push of a tag v* (only on the user's command) → the same build plus a DRAFT release with both files and
#   the approved notes from docs/release_notes/<tag>.md; the user presses «Publish» himself.
name: Build installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build of another version (e.g. 1.0.1); empty = core/version.py"
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.build.outputs.version }}
      installer: ${{ steps.build.outputs.installer }}
      sha256: ${{ steps.build.outputs.sha256 }}
    env:
      PYTHONUTF8: "1"
      SE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/requirements-build.txt
            packaging/constraints-win.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r packaging/requirements-build.txt -c packaging/constraints-win.txt
          pip list

      - name: Unit tests without UI
        run: python -m pytest -q tests/test_stage6.py tests/test_updater.py -k "not ui_"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Inno Setup: $iscc"

      - name: Build (PyInstaller onedir + installer + SHA-256)
        id: build
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ($v) { python packaging/build.py --version $v } else { python packaging/build.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $want = "v${{ steps.build.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $want) { throw "tag ${{ github.ref_name }} != $want (core/version.py)" }

      - name: Smoke test of the built program
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "smoke.json"
          $env:SE_SMOKE_REPORT = $report
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata"
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $p = Start-Process -FilePath "dist\SignatureExtractor\SignatureExtractor.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "the program did not close in 90 s" }
          if (-not (Test-Path $report)) {
            Get-Content (Join-Path $env:APPDATA "Signature Extractor\signature_extractor.log") -ErrorAction SilentlyContinue
            throw "no smoke report"
          }
          Get-Content $report
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $r.ok -or -not $r.frozen) { throw "smoke test failed" }

      - name: Sizes
        shell: pwsh
        run: |
          $d = (Get-ChildItem dist\SignatureExtractor -Recurse -File | Measure-Object Length -Sum).Sum
          "onedir: {0:N1} MB" -f ($d / 1MB)
          Get-ChildItem dist\*.exe, dist\*.sha256 | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-Content dist\*.sha256

      - name: Excluded files are not in the build
        shell: pwsh
        run: |
          # remarks 98, 104, 105: video DLL of OpenCV, ezdxf sources, Pillow AVIF; remark 99: pi-heif, no x265
          $int = "dist\SignatureExtractor\_internal"
          Get-ChildItem "$int\cv2" -File | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $bad = @(Get-ChildItem $int -Recurse -File | Where-Object {
            $_.Name -like "opencv_videoio_ffmpeg*" -or $_.Name -like "_avif*" -or $_.Name -like "*x265*" -or
            ($_.FullName -like "*\ezdxf\*" -and $_.Extension -in ".c", ".pyx", ".pxd", ".pyi", ".h") })
          $bad | ForEach-Object { "unexpected: " + $_.FullName }
          if ($bad.Count -gt 0) { throw "excluded files are in the build" }
          if (-not (Get-ChildItem $int -Recurse -File -Filter "_pi_heif*")) { throw "pi_heif is not in the build" }

      - uses: actions/upload-artifact@v4
        with:
          name: SignatureExtractor-${{ steps.build.outputs.version }}-setup
          path: |
            dist/${{ steps.build.outputs.installer }}
            dist/${{ steps.build.outputs.installer }}.sha256
          if-no-files-found: error
          retention-days: 30

  draft-release:
    # only for a tag pushed on the user's command; creates a DRAFT, never publishes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SignatureExtractor-${{ needs.build.outputs.version }}-setup
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          notes="docs/release_notes/${TAG}.md"
          test -f "$notes" || { echo "no $notes"; exit 1; }
          { cat "$notes"; printf '\n\nSHA-256 (%s): `%s`\n' "$INSTALLER" "$SHA"; } > out/notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file out/notes.md \
            "out/$INSTALLER" "out/$INSTALLER.sha256"
